# CI: backend checks + frontend build on every PR.
name: ci

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: gonaj
          POSTGRES_USER: gonaj
          POSTGRES_PASSWORD: gonaj
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gonaj -d gonaj"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    env:
      DJANGO_SECRET_KEY: ci-only-insecure-key
      POSTGRES_DB: gonaj
      POSTGRES_USER: gonaj
      POSTGRES_PASSWORD: gonaj
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements-dev.txt
      - name: Check for missing migrations
        run: ./manage.py makemigrations --check --dry-run
        working-directory: backend
      - name: Run backend test suite
        run: ./manage.py test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build frontend
        run: npm run build
        working-directory: frontend
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
